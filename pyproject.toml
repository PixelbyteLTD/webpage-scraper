[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescrape"
version = "0.1.0"
description = "Capture a logged-in browser session for sites behind a login"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "readability-lxml>=0.9.0",
    "trafilatura>=2.0.0",
    "markdownify>=0.11.0",
]

[project.scripts]
sitescrape = "sitescrape.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
