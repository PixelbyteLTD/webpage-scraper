[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescrape"
version = "0.1.0"
description = "Capture a logged-in browser session for sites behind a login"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "playwright>=1.40.0",
]

[project.scripts]
sitescrape = "sitescrape.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
